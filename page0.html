<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thaï Malin — Mini-guide Vietnam — Couverture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 680px;
    aspect-ratio: 1024 / 1536;
    margin: 0 auto;
  }
  .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 6px;
  }
  .hotspot {
    position: absolute;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .hotspot:active { transform: scale(0.97); }

  /* Bouton "Suivant" en bas de la page, par-dessus l'image */
  .btn-next {
    left: 50%;
    bottom: 3%;
    transform: translateX(-50%);
    width: 46%;
    height: 7%;
    background: linear-gradient(135deg, #d35400, #f0955a);
    color: #fff;
    border-radius: 50px;
    font-size: clamp(14px, 2.4vw, 18px);
    box-shadow: 0 6px 18px rgba(211, 84, 0, 0.45);
  }
  .btn-next:hover { box-shadow: 0 8px 22px rgba(211, 84, 0, 0.6); }

  /* Zones cliquables discrètes sur les 6 destinations listées sur le panneau gauche */
  .dest {
    left: 2%;
    width: 19%;
    height: 4.1%;
    background: rgba(255,255,255,0);
  }
  .dest-hanoi    { top: 10.3%; }
  .dest-halong   { top: 14.7%; }
  .dest-hoian    { top: 19.1%; }
  .dest-hue      { top: 23.5%; }
  .dest-hcm      { top: 27.9%; }
  .dest-mekong   { top: 32.3%; }

  /* Barre de navigation sous l'image (hors illustration, jamais de superposition) */
  .navbar{display:flex;gap:12px;width:100%;max-width:680px;margin:14px auto 0;padding:0 14px;}
  .navbar .hotspot{position:static !important;left:auto !important;right:auto !important;top:auto !important;bottom:auto !important;transform:none !important;width:auto !important;height:48px !important;flex:1;}
  .navbar .btn-prev{flex:0 0 auto;min-width:140px;}
</style>
<!-- PWA Mini-guide -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini-guide Vietnam">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>

</body>
</html>
