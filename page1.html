  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Bouton "Suivant" en bas de la page, par-dessus l'image */

    color: #fff;
    border-radius: 50px;
    font-size: clamp(14px, 2.4vw, 18px);

  /* Zones cliquables discrètes sur les 6 destinations listées sur le panneau gauche */

    width: 14%;
    height: 3.2%;

  .dest-hoian    { top: 11.4%; }
  .dest-hue      { top: 13.7%; }
  .dest-hcm      { top: 16.7%; }
  .dest-mekong   { top: 18.9%; }
  .dest-phuquoc  { top: 21.5%; }
  .tile { border-radius: 10px; }
  .pin:active, .dest:active { background: rgba(255,200,80,.35); box-shadow: 0 0 0 2px rgba(255,200,80,.9); }
